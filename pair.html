<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MrNobody MD - Pairing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      width: 350px;
      padding: 30px 25px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .card h2 { color: #38bdf8; font-size: 22px; margin-bottom: 6px; }
    .card p { color: #9ca3af; font-size: 13px; margin-bottom: 22px; }
    .input-box {
      display: flex;
      background: #1f2937;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #374151;
    }
    .input-box input {
      width: 70%;
      padding: 12px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .input-box button {
      width: 30%;
      background: #0284c7;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .input-box button:hover { background: #0369a1; }
    #spinner { display: none; margin-top: 15px; color: #38bdf8; font-size: 14px; }
    #code-area { margin-top: 20px; }
    .code-box {
      background: #1e293b;
      border: 1px dashed #38bdf8;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .code-box span { font-size: 12px; color: #94a3b8; }
    .code-box h3 { font-size: 20px; color: #facc15; margin-top: 4px; letter-spacing: 2px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>MrNobody MD</h2>
    <p>Enter your WhatsApp number with country code</p>
    
    <div class="input-box">
      <input type="text" id="number" placeholder="9477xxxxxxx">
      <button id="btn">Submit</button>
    </div>

    <div id="spinner"><i class="fa-solid fa-spinner fa-spin"></i> Generating...</div>
    <div id="code-area"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js"></script>
  <script>
    const btn = document.getElementById("btn");
    const numInput = document.getElementById("number");
    const spinner = document.getElementById("spinner");
    const codeArea = document.getElementById("code-area");

    btn.addEventListener("click", async () => {
      const num = numInput.value.replace(/[^0-9]/g, "");
      if (!num || num.length < 10) {
        codeArea.innerHTML = '<span style="color:#ef4444;font-size:13px;">❗ Enter valid phone number</span>';
        return;
      }

      spinner.style.display = "block";
      codeArea.innerHTML = "";

      try {
        const { data } = await axios(`/code?number=${num}`);
        const code = data.code || "Error";
        spinner.style.display = "none";
        
        codeArea.innerHTML = `
          <div class="code-box" onclick="copyCode('${code}')">
            <span>Tap to copy Pairing Code</span>
            <h3 id="pair-code">${code}</h3>
          </div>
        `;
      } catch (err) {
        spinner.style.display = "none";
        codeArea.innerHTML = '<span style="color:#ef4444;font-size:13px;">❗ Failed to generate code</span>';
      }
    });

    async function copyCode(code) {
      await navigator.clipboard.writeText(code);
      const pairCodeElem = document.getElementById("pair-code");
      pairCodeElem.innerText = "COPIED!";
      pairCodeElem.style.color = "#4ade80";
      setTimeout(() => {
        pairCodeElem.innerText = code;
        pairCodeElem.style.color = "#facc15";
      }, 1500);
    }
  </script>
</body>
</html>
