<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRNOBODY PAIR CODE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #0d1117;
      font-family: 'Arial', sans-serif;
      color: #fff;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .box {
      width: 320px;
      padding: 25px;
      text-align: center;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    h3 { color: #58a6ff; margin-bottom: 8px; }
    p { color: #8b949e; font-size: 13px; margin-bottom: 20px; }
    .input-container {
      display: flex;
      background: #0d1117;
      border-radius: 8px;
      padding: 4px;
      border: 1px solid #30363d;
    }
    .input-container input {
      background: transparent;
      width: 70%;
      padding: 10px;
      border: none;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .input-container button {
      width: 30%;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .input-container button:hover { background: #2ea043; }
    #loading-spinner { display: none; color: #e3b341; margin-top: 15px; }
    .fa-spinner { animation: spin 2s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <h3>MrNobody MD</h3>
      <p>Enter your WhatsApp number with country code</p>
      <div class="input-container">
        <input type="text" id="number" placeholder="9477xxxxxxx">
        <button id="submit">Get</button>
      </div>
      <div id="loading-spinner">
        <i class="fas fa-spinner fa-spin"></i> Connecting...
      </div>
      <br>
      <main id="pair"></main>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    let a = document.getElementById("pair");
    let b = document.getElementById("submit");
    let c = document.getElementById("number");

    async function Copy() {
      let obj = document.getElementById("copy");
      await navigator.clipboard.writeText(obj.innerText.replace('CODE: ', ''));
      obj.innerText = "✔️ COPIED";
      obj.style = "color:#3fb950;font-weight:bold";
      setTimeout(() => { 
        obj.innerText = "CODE: " + obj.dataset.code; 
        obj.style = "color:#58a6ff;font-weight:bold";
      }, 1500);
    }

    b.addEventListener("click", async (e) => {
      e.preventDefault();
      if (!c.value) {
        a.innerHTML = '<span style="color:#f85149;font-size:13px;">❗ Enter phone number!</span>';
        return;
      }
      const bc = c.value.replace(/[^0-9]/g, "");
      document.getElementById("loading-spinner").style.display = "block";
      a.innerHTML = '';
      try {
        let { data } = await axios(`/code?number=${bc}`);
        let code = data.code || "Unavailable";
        document.getElementById("loading-spinner").style.display = "none";
        a.innerHTML = `<div style="background:#0d1117;padding:12px;border-radius:6px;border:1px dashed #58a6ff;margin-top:10px;cursor:pointer;" onclick="Copy()">
          <span style="color:#8b949e;font-size:12px;">Tap to copy pairing code:</span><br>
          <font id="copy" data-code="${code}" style="color:#58a6ff;font-weight:bold;font-size:18px;">CODE: ${code}</font>
        </div>`;
      } catch (err) {
        document.getElementById("loading-spinner").style.display = "none";
        a.innerHTML = '<span style="color:#f85149;font-size:13px;">❗ Error generating code</span>';
      }
    });
  </script>
</body>
</html>
