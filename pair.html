<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRNOBODY MD - PAIRING</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #0d0d0d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    .container {
      background: #1a1a1a;
      width: 350px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(162, 0, 0, 0.4);
      text-align: center;
      border-top: 4px solid #a20000;
    }
    .tabs {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
    }
    .tab {
      cursor: pointer;
      padding: 10px 20px;
      font-weight: bold;
      color: #777;
      border-bottom: 2px solid transparent;
      transition: 0.3s;
    }
    .tab.active {
      color: #a20000;
      border-bottom: 2px solid #a20000;
    }
    .section { display: none; }
    .section.active { display: block; }
    
    .input-container {
      display: flex;
      background: #333;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 15px;
    }
    .input-container input {
      background: transparent;
      border: none;
      color: #fff;
      padding: 12px;
      width: 100%;
      outline: none;
    }
    .input-container button {
      background: #a20000;
      border: none;
      color: #fff;
      padding: 12px 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .input-container button:hover { background: #ff1a1a; }
    
    #loading-spinner, #qr-loading-spinner {
      display: none;
      color: #a20000;
      margin-top: 15px;
      font-size: 20px;
    }
    
    .qr-image {
      margin-top: 20px;
      width: 200px;
      height: 200px;
      border-radius: 10px;
      display: none;
    }
    .footer-text {
      margin-top: 25px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <i class="fa fa-user-secret" style="font-size: 40px; color: #a20000; margin-bottom: 10px;"></i>
    <h2>MRNOBODY MD</h2>
    
    <div class="tabs">
      <div class="tab active" id="tab-pair" onclick="switchTab('pair')">Pair Code</div>
      <div class="tab" id="tab-qr" onclick="switchTab('qr')">QR Code</div>
    </div>

    <!-- Pair Code Section -->
    <div id="section-pair" class="section active">
      <p style="font-size: 14px; color: #ccc;">Enter your number with country code.</p>
      <div class="input-container">
        <input placeholder="9477xxxxxxx" type="number" id="number">
        <button id="submit">Get Code</button>
      </div>
      <div id="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>
      <div id="pair-result" style="margin-top: 20px;"></div>
    </div>

    <!-- QR Code Section -->
    <div id="section-qr" class="section">
      <p style="font-size: 14px; color: #ccc;">Click below to generate QR code.</p>
      <button onclick="getQR()" style="background: #a20000; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">Generate QR</button>
      <div id="qr-loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>
      <img id="qr-img" class="qr-image" src="" alt="QR Code">
      <div id="qr-result" style="margin-top: 15px; font-size: 14px; color: #4caf50;"></div>
    </div>

    <div class="footer-text">Developed by Milshen Meghishnu</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('section-' + tab).classList.add('active');
    }

    async function Copy(text) {
      await navigator.clipboard.writeText(text);
      alert("Code Copied!");
    }

    // Pair Code Logic
    document.getElementById("submit").addEventListener("click", async (e) => {
      e.preventDefault();
      let input = document.getElementById("number");
      let resultDiv = document.getElementById("pair-result");
      
      if (!input.value) {
        resultDiv.innerHTML = '<span style="color:red;">❗Enter your number.</span>';
        return;
      }
      
      document.getElementById("loading-spinner").style.display = "block";
      resultDiv.innerHTML = '';
      
      try {
        let num = input.value.replace(/[^0-9]/g, "");
        let { data } = await axios(`/code?number=${num}`);
        let code = data.code || "Error";
        resultDiv.innerHTML = `
          <div style="background: #222; padding: 15px; border-radius: 8px;">
            <span style="font-size: 20px; font-weight: bold; color: #fff;">${code}</span><br><br>
            <button onclick="Copy('${code}')" style="background: #a20000; border: none; padding: 5px 15px; color: #fff; border-radius: 5px; cursor: pointer;">Copy Code</button>
          </div>
        `;
      } catch (err) {
        resultDiv.innerHTML = '<span style="color:red;">❗Error generating code.</span>';
      }
      document.getElementById("loading-spinner").style.display = "none";
    });

    // QR Code Logic
    async function getQR() {
      let qrImg = document.getElementById("qr-img");
      let resultDiv = document.getElementById("qr-result");
      
      document.getElementById("qr-loading-spinner").style.display = "block";
      qrImg.style.display = "none";
      resultDiv.innerHTML = "";
      
      try {
        let { data } = await axios(`/qr`);
        if(data.qr) {
          qrImg.src = data.qr;
          qrImg.style.display = "block";
          resultDiv.innerHTML = "Scan this QR with WhatsApp Linked Devices";
        } else {
          resultDiv.innerHTML = '<span style="color:red;">❗Failed to load QR.</span>';
        }
      } catch (err) {
        resultDiv.innerHTML = '<span style="color:red;">❗Error generating QR.</span>';
      }
      document.getElementById("qr-loading-spinner").style.display = "none";
    }
  </script>
</body>
</html>
